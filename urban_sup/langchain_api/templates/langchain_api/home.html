<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Application</title>
    <style>
        :root {
            --sidebar-width: 260px;
            --sidebar-bg: #f7f7f8;
            --main-bg: #ffffff;
            --border-color: #d9d9e3;
            --primary-color: #10a37f;
            --primary-hover: #0d8a6a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--main-bg);
            height: 100vh;
            color: #333;
        }

        .sidebar {
            height: 100vh;
            width: var(--sidebar-width);
            position: fixed;
            left: 0;
            top: 0;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            padding: 10px;
            transition: transform 0.2s ease;
            z-index: 100;
            overflow-y: auto;
        }

        .main-content {
            margin-left: var(--sidebar-width);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            padding: 0 15px;
        }

        .chat-history {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px 0;
        }

        .input-container {
            position: relative;
            padding-bottom: 20px;
        }

        .input-wrapper {
            display: flex;
            align-items: flex-end;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .chat-input {
            flex-grow: 1;
            border: none;
            outline: none;
            resize: none;
            font-size: 16px;
            line-height: 1.5;
            max-height: 200px;
            padding: 8px 0;
            font-family: inherit;
        }

        .send-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            margin-left: 10px;
            cursor: pointer;
            transition: background-color 0.2s;
            height: 40px;
        }

        .send-btn:hover {
            background-color: var(--primary-hover);
        }

        .send-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .new-chat-btn {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .new-chat-btn:hover {
            background-color: var(--primary-hover);
        }

        .chat-item {
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 5px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background-color 0.2s;
        }

        .chat-item:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        .chat-item.active {
            background-color: rgba(16, 163, 127, 0.1);
        }

        .sidebar-header {
            font-weight: bold;
            margin: 10px 0 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            color: #666;
        }

        .message {
            padding: 12px 16px;
            margin-bottom: 16px;
            border-radius: 8px;
            max-width: 85%;
            line-height: 1.5;
        }

        .user-message {
            background-color: #f0f7ff;
            margin-left: auto;
        }

        .bot-message {
            background-color: #f8f9fa;
            margin-right: auto;
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
            }

            .sidebar-toggle {
                display: block !important;
            }
        }

        .sidebar-toggle {
            position: fixed;
            left: 10px;
            top: 10px;
            z-index: 110;
            display: none;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
        }

        /* Simple loading animation */
        .typing-indicator {
            display: flex;
            padding: 12px 16px;
            margin-bottom: 16px;
            background-color: #f8f9fa;
            border-radius: 8px;
            max-width: 85%;
            margin-right: auto;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background-color: #999;
            border-radius: 50%;
            margin: 0 2px;
            animation: typingAnimation 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingAnimation {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-5px); }
        }
    </style>
</head>
<body>
    <button class="sidebar-toggle" id="sidebarToggle">☰</button>

    <div class="sidebar" id="sidebar">
        <button class="new-chat-btn" id="newChatBtn">+ Новый чат</button>
        <div class="sidebar-header">Недавние чаты</div>
        <div class="chat-list" id="chatList">
            <div class="chat-item active">Как работает ИИ?</div>
            <div class="chat-item">Помоги с программированием</div>
            <div class="chat-item">Идеи для проекта</div>
            <div class="chat-item">Объясни теорию относительности</div>
            <div class="chat-item">Рецепт пасты карбонара</div>
        </div>
    </div>

    <div class="main-content">
        <div class="chat-container">
            <div class="chat-history" id="chatHistory">
                <div class="message user-message">
                    Привет! Как дела?
                </div>
                <div class="message bot-message">
                    Привет! Я всего лишь программа, поэтому у меня нет чувств, но спасибо, что спросил! Чем могу помочь?
                </div>
            </div>

            <div class="input-container">
                <div class="input-wrapper">
                    <textarea class="chat-input" id="chatInput" rows="1" placeholder="Напишите ваш вопрос здесь..."></textarea>
                    <button class="send-btn" id="sendBtn" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Toggle sidebar on mobile
        document.getElementById('sidebarToggle').addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('active');
        });

        // Switch between chats
        const chatItems = document.querySelectorAll('.chat-item');
        chatItems.forEach(item => {
            item.addEventListener('click', function() {
                chatItems.forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                // Here you would load the chat history for the selected chat
            });
        });

        // New chat button
        document.getElementById('newChatBtn').addEventListener('click', function() {
            chatItems.forEach(i => i.classList.remove('active'));
            document.getElementById('chatHistory').innerHTML = '';
            document.getElementById('chatInput').value = '';
            // Here you would create a new chat in your backend
        });

        // Auto-resize textarea
        const textarea = document.getElementById('chatInput');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';

            // Enable/disable send button based on input
            document.getElementById('sendBtn').disabled = this.value.trim() === '';
        });

        // Send message
        document.getElementById('sendBtn').addEventListener('click', sendMessage);

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();

            if (message) {
                const chatHistory = document.getElementById('chatHistory');

                // Add user message
                const userMsg = document.createElement('div');
                userMsg.className = 'message user-message';
                userMsg.textContent = message;
                chatHistory.appendChild(userMsg);

                // Clear input and reset height
                input.value = '';
                input.style.height = 'auto';
                document.getElementById('sendBtn').disabled = true;

                // Add typing indicator
                const typingIndicator = document.createElement('div');
                typingIndicator.className = 'typing-indicator';
                typingIndicator.innerHTML = `
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                `;
                chatHistory.appendChild(typingIndicator);

                // Scroll to bottom
                chatHistory.scrollTop = chatHistory.scrollHeight;

                // Here you would send the message to your backend and get a response
                // For now, we'll just simulate a response
                setTimeout(() => {
                    // Remove typing indicator
                    chatHistory.removeChild(typingIndicator);

                    const botMsg = document.createElement('div');
                    botMsg.className = 'message bot-message';
                    botMsg.textContent = "Это пример ответа. В реальном приложении здесь был бы ответ от вашего бэкенда.";
                    chatHistory.appendChild(botMsg);

                    // Scroll to bottom
                    chatHistory.scrollTop = chatHistory.scrollHeight;
                }, 1500);
            }
        }

        // Allow sending message with Enter (but allow Shift+Enter for new line)
        document.getElementById('chatInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
